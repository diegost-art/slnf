<style>
  :root{
    --bg:#0a0b0d;
    --panel:#131519;
    --panel-2:#1b1e23;
    --line:#282b31;
    --text:#f2f3f4;
    --text-dim:#9aa0a6;
    --text-dim-2:#6d7278;
    --silver:#aeb6bc;
    --red:#ffb81c;
    --red-bright:#ffc72c;
    --red-dim:#8a6a12;
    --gold:#b9975b;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --radius:2px;
  }
  :root:not([data-theme="light"]){
    --bg:#0a0b0d; --panel:#131519; --panel-2:#1b1e23; --line:#282b31; --text:#f2f3f4; --text-dim:#9aa0a6;
  }
  :root[data-theme="dark"]{
    --bg:#0a0b0d; --panel:#131519; --panel-2:#1b1e23; --line:#282b31; --text:#f2f3f4; --text-dim:#9aa0a6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0a0b0d; --panel:#131519; --panel-2:#1b1e23; --line:#282b31; --text:#f2f3f4; --text-dim:#9aa0a6; }
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(200,16,46,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(174,182,188,0.05), transparent 55%),
      var(--bg);
    padding-bottom:64px;
  }
  ::selection{ background:var(--red); color:#161616; }

  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }

  /* ---------- HEADER ---------- */
  header.top{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .top-inner{
    display:flex; align-items:center; gap:16px;
    padding:22px 20px 20px;
    max-width:1080px; margin:0 auto;
  }
  .mark{
    width:46px; height:46px; flex:none;
    border-radius:50%;
    background:conic-gradient(from 220deg, var(--red), var(--red-dim) 40%, #1b1e23 41%, #1b1e23 100%);
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
  }
  .mark span{
    font-family:var(--font-display); font-weight:700; font-size:15px; letter-spacing:0.5px; color:#fff;
  }
  h1{
    font-family:var(--font-display); font-weight:700; font-size:clamp(24px,4vw,34px);
    letter-spacing:0.5px; line-height:1; text-transform:uppercase;
  }
  h1 em{ font-style:normal; color:var(--red-bright); }
  .top-sub{ color:var(--text-dim); font-size:13px; margin-top:6px; }
  .top-sub a{ color:var(--silver); }

  /* ---------- LEAGUE TOGGLE ---------- */
  .league-toggle{
    margin-top:28px;
    display:flex; gap:2px;
    border-bottom:1px solid var(--line);
  }
  .league-btn{
    font-family:var(--font-display); font-weight:600; font-size:17px; letter-spacing:0.5px;
    text-transform:uppercase; color:var(--text-dim);
    background:none; border:none; cursor:pointer;
    padding:10px 4px 12px; margin-right:26px;
    position:relative;
  }
  .league-btn .cnt{ font-family:var(--font-body); font-size:11px; color:var(--text-dim-2); font-weight:600; margin-left:6px; }
  .league-btn::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--red);
    transform:scaleX(0); transform-origin:left; transition:transform .25s ease;
  }
  .league-btn.active{ color:#fff; }
  .league-btn.active::after{ transform:scaleX(1); }
  .league-btn:focus-visible{ outline:2px solid var(--red-bright); outline-offset:2px; }

  /* ---------- CATEGORY CHIPS ---------- */
  .chips-row{
    margin-top:18px;
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;
    scrollbar-width:thin;
  }
  .chips-row::-webkit-scrollbar{ height:5px; }
  .chips-row::-webkit-scrollbar-thumb{ background:var(--line); }
  .chip{
    flex:none; font-family:var(--font-body); font-weight:600; font-size:13px;
    color:var(--text-dim); background:var(--panel); border:1px solid var(--line);
    padding:9px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .chip:hover{ border-color:var(--silver); color:var(--text); }
  .chip.active{ background:var(--red); border-color:var(--red); color:#161616; }
  .chip:focus-visible{ outline:2px solid var(--red-bright); outline-offset:2px; }

  /* ---------- PANEL ---------- */
  .panel{
    margin-top:20px;
    background:var(--panel);
    border:1px solid var(--line);
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    padding:22px 22px 16px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h2{
    font-family:var(--font-display); font-weight:600; font-size:22px; text-transform:uppercase; letter-spacing:0.3px;
  }
  .panel-head .q{
    color:var(--text-dim); font-size:13px; margin-top:5px; max-width:60ch;
  }
  .panel-head .leader-tag{
    font-size:11px; color:var(--text-dim-2); text-align:right; white-space:nowrap; margin-top:3px;
  }
  .panel-head .leader-tag b{ color:var(--red-bright); font-family:var(--font-display); font-size:13px; letter-spacing:0.3px; }

  .sort-row{
    display:flex; gap:6px; padding:14px 22px 0;
  }
  .sort-btn{
    font-size:11px; letter-spacing:0.6px; text-transform:uppercase; font-weight:600;
    color:var(--text-dim-2); background:none; border:1px solid transparent; cursor:pointer;
    padding:5px 9px; border-radius:2px;
  }
  .sort-btn.active{ color:var(--text); background:var(--panel-2); border-color:var(--line); }
  .sort-btn:hover{ color:var(--text); }

  .rows{ padding:8px 22px 22px; }
  .row{
    display:grid;
    grid-template-columns:26px 34px 1fr 64px 80px;
    align-items:center;
    gap:12px;
    padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .row:last-child{ border-bottom:none; }
  .row .rank{ font-family:var(--font-display); font-size:13px; color:var(--text-dim-2); text-align:right; }
  .row.zero .rank{ color:#3a3d42; }
  .badge{
    width:32px; height:32px; border-radius:50%;
    background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:10px; font-weight:600; letter-spacing:0.3px; color:var(--silver);
  }
  .row.leader .badge{ background:var(--red); border-color:var(--red); color:#161616; }
  .row.zero .badge{ opacity:0.35; }

  .team-col{ min-width:0; }
  .team-name{
    font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row.zero .team-name{ color:var(--text-dim-2); font-weight:500; }
  .bar-track{
    margin-top:5px; height:6px; background:var(--panel-2); border-radius:99px; overflow:hidden;
  }
  .bar-fill{
    height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--red-dim), var(--red-bright));
    width:0%;
    transition:width .7s cubic-bezier(.2,.7,.2,1);
  }
  .row.leader .bar-fill{ background:linear-gradient(90deg, var(--red), #ff2d4d); }

  .pct{
    font-family:var(--font-display); font-weight:600; font-size:15px; text-align:right; color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .row.zero .pct{ color:var(--text-dim-2); font-weight:400; }
  .subs{ font-size:11.5px; color:var(--text-dim-2); text-align:right; white-space:nowrap; }

  @media(max-width:600px){
    .row{ grid-template-columns:20px 28px 1fr 50px; }
    .subs{ display:none; }
    .panel-head{ flex-direction:column; }
    .panel-head .leader-tag{ text-align:left; }
  }

  footer{
    max-width:1080px; margin:34px auto 0; padding:0 20px;
    color:var(--text-dim-2); font-size:11.5px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    .bar-fill{ transition:none; }
    .league-btn::after{ transition:none; }
  }
</style>
</head>

}

function renderChips(){
  const el = document.getElementById('chipsRow');
  const cats = DATA[state.league].cats;
  el.innerHTML = cats.map(c => `
    <button class="chip ${c.id===state.cat?'active':''}" data-cat="${c.id}">${c.label}</button>
  `).join('');
  el.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.cat = btn.dataset.cat;
      renderPanel();
      el.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.cat===state.cat));
    });
  });
}

function currentCat(){
  return DATA[state.league].cats.find(c=>c.id===state.cat);
}

function renderPanel(){
  const cat = currentCat();
  document.getElementById('catTitle').textContent = cat.label;
  document.getElementById('catQuestion').textContent = cat.question + ' — 22 von 22 Teilnehmenden haben geantwortet.';

  let teams = [...cat.teams];
  const leader = teams.reduce((a,b)=> b.pct>a.pct ? b : a, teams[0]);

  if(state.sort==='rank'){
    teams.sort((a,b)=> b.pct - a.pct || a.name.localeCompare(b.name));
  } else {
    teams.sort((a,b)=> a.name.localeCompare(b.name));
  }

  document.getElementById('leaderTag').innerHTML = leader.pct>0
    ? `Favorit<br><b>${leader.name}</b> · ${leader.pct.toFixed(1).replace('.',',')}%`
    : '';

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = teams.map((team, i)=>{
    const isLeader = team.pct>0 && team===leader && state.sort==='rank';
    const isZero = team.pct===0;
    const code = CODES[team.name] || team.name.slice(0,3).toUpperCase();
    const rankLabel = state.sort==='rank' ? (i+1) : '·';
    return `
      <div class="row ${isLeader?'leader':''} ${isZero?'zero':''}">
        <div class="rank">${rankLabel}</div>
        <div class="badge">${code}</div>
        <div class="team-col">
          <div class="team-name">${team.name}</div>
          <div class="bar-track"><div class="bar-fill" data-width="${team.pct}"></div></div>
        </div>
        <div class="pct">${team.pct.toFixed(1).replace('.',',')}%</div>
        <div class="subs">${team.subs} ${team.subs===1?'Antwort':'Antworten'}</div>
      </div>
    `;
  }).join('');

  requestAnimationFrame(()=>{
    rowsEl.querySelectorAll('.bar-fill').forEach((bar, idx)=>{
      setTimeout(()=>{ bar.style.width = bar.dataset.width + '%'; }, 15*idx);
    });
  });
}

document.querySelectorAll('.sort-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.sort = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active', b===btn));
    renderPanel();
  });
});

function renderAll(){
  renderLeagueToggle();
  renderChips();
  renderPanel();
}

renderAll();
</script>

</body>
</html>
